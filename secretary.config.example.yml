# vault-secretary の個人化設定（Pythonバッチ用）
#
# このファイルを `secretary.config.yml` にコピーして、自分の値に書き換えて
# **コミットする**（vault リポを private 運用する前提。秘匿値は入れない）。
# CI（GitHub Actions）も checkout して読むので、commit していないと参照できない。
#
# `.claude/commands/` 内の Markdown コマンドのプレースホルダー
# （{{PARTNER_NAME}} / {{SHARED_CALENDAR_LABEL}} /
# {{CALENDAR_ID_SHARED}} / {{CALENDAR_ID_PRIVATE}}）は
# `bash setup.sh` で対話的に置換するか、手動で sed する。

# Daily/Weekly のシステムプロンプトで本人を呼ぶ呼び名（例: 「太郎さんは〜した」）
user_name: "ユーザー"

# 論理日付の境界時刻（JST, 0-23）。深夜2時のメモを「昨日のメモ」として扱うために使う。
# 例: 5 にすると 5:00 JST が日付の切れ目になる。
# この値が境界時刻の唯一のソース。`.github/workflows/daily-batch.yml` は毎時起動するが、
# `.scripts/daily_batch.py` がこの値と一致する hour のときだけ処理を進める。
# ローカル CLI 実行で違う時間帯に試したい場合は環境変数 DAILY_BOUNDARY_HOUR で上書き可能。
daily_boundary_hour: 5
