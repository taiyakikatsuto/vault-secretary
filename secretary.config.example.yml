# vault-secretary の個人化設定（Pythonバッチ用）
#
# このファイルを `secretary.config.yml` にコピーして、自分の値に書き換える。
# `secretary.config.yml` は .gitignore で除外されている。
#
# `.claude/commands/` 内の Markdown コマンドのプレースホルダー
# （{{USER_NAME}} / {{PARTNER_NAME}} / {{SHARED_CALENDAR_LABEL}} /
# {{CALENDAR_ID_SHARED}} / {{CALENDAR_ID_PRIVATE}} / {{X_USERNAME}}）は
# 手動で置換するか、README に書いてある sed コマンドで一括置換する。

# Daily/Weekly のシステムプロンプトで本人を呼ぶ呼び名（例: 「太郎さんは〜した」）
user_name: "ユーザー"
