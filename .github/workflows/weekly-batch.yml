name: Weekly Batch

on:
  # daily_batch が成功完了したら起動（毎日1回）。
  # weekly_batch.py 側で月曜＆境界時刻判定して、それ以外の日は即 exit する。
  workflow_run:
    workflows: ["Daily Batch"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  weekly-process:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run weekly batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python .scripts/weekly_batch.py

      - name: Commit and push
        run: |
          git config user.name "obsidian-bot"
          git config user.email "bot@obsidian"
          git add -A
          git diff --staged --quiet || git commit -m "🤖 weekly batch $(date +%Y-%m-%d)"
          git push