name: Daily Batch

on:
  schedule:
    - cron: '0 22 * * *'  # 翌朝7時 JST（=31時）
  workflow_dispatch:       # 手動実行も可能

jobs:
  daily-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0  # git履歴全部必要

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run daily batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_BOUNDARY_HOUR: '7'
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python .scripts/daily_batch.py

      - name: Commit and push
        run: |
          git config user.name "obsidian-bot"
          git config user.email "bot@obsidian"
          git add -A
          git diff --staged --quiet || git commit -m "🤖 daily batch $(date +%Y-%m-%d)"
          git push